name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: 0.2.126

permissions:
  contents: read
  pull-requests: write

jobs:
  js:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --linker=isolated --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun run test:coverage

      - name: Report what each package covers
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Verify emitted protocol schemas are current
        run: |
          bun run --filter @tholus/engine-protocol emit-schema
          git diff --exit-code -- packages/engine-protocol/schema

      - name: Release readiness
        run: node scripts/check-release-readiness.mjs

      - name: Verify the public API report is current
        run: |
          bun run api
          git diff --exit-code -- api

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  scripts:
    name: fork rewrite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s scripts -p "test_*.py" -v

  wasm:
    name: wasm engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          if [ -z "$FORK_TOKEN" ]; then
            echo "FORK_TOKEN is unset. GITHUB_TOKEN cannot read a second private repository,"
            echo "so vendor/uv cannot be checked out."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${FORK_TOKEN}@github.com/KDust7/uv-wasm-fork".insteadOf \
            "https://github.com/KDust7/uv-wasm-fork"
          git submodule update --init --recursive

      - name: The submodule pointer is not stale
        run: |
          pinned=$(git -C vendor/uv rev-parse HEAD)
          tip=$(git -C vendor/uv ls-remote origin refs/heads/wasm/v0.12.3 | cut -f1)
          if [ "$pinned" != "$tip" ]; then
            echo "vendor/uv is pinned at $pinned but the fork's branch tip is $tip."
            echo "A fork commit without a pointer bump ships an old fork past the parity gate."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --linker=isolated --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Format
        run: cargo fmt --check -p uv-wasm-engine -p uv-wasm-xtask

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: The engine crate covers itself
        run: |
          cargo llvm-cov --json --output-path "$RUNNER_TEMP/engine-cov.json" -p uv-wasm-engine
          node scripts/check-rust-coverage.mjs "$RUNNER_TEMP/engine-cov.json" crates uv-wasm-engine

      - name: Build wasm artifact
        run: cargo xtask build

      - name: Install the browser the parity gate runs in
        run: bun run playwright install --with-deps chromium

      - name: Engine answers uv's command line
        run: bun run vitest run test/parity

      - name: Size report
        run: bun run size

      - name: Report the grid
        run: |
          node scripts/parity-summary.mjs > "$RUNNER_TEMP/parity.md"
          cat "$RUNNER_TEMP/parity.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Say the same thing on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sticky-comment.mjs "$RUNNER_TEMP/parity.md"

      - uses: actions/upload-artifact@v5
        with:
          name: engine-wasm
          path: |
            packages/core/assets/
            size-report.json
          retention-days: 7
