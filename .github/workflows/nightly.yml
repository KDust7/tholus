name: nightly

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      browser:
        description: "Run only this browser"
        required: false
        default: ""

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: 0.2.126

jobs:
  browsers:
    name: the browser gates on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - name: Check out the fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          if [ -z "$FORK_TOKEN" ]; then
            echo "FORK_TOKEN is unset, so vendor/uv cannot be checked out."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${FORK_TOKEN}@github.com/KDust7/tholus-fork".insteadOf \
            "https://github.com/KDust7/tholus-fork"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --linker=isolated --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Build wasm artifact
        run: cargo xtask build --skip-opt

      - name: Install ${{ matrix.browser }}
        run: bun run playwright install --with-deps ${{ matrix.browser }}

      - name: The browser gates
        if: inputs.browser == '' || inputs.browser == matrix.browser
        env:
          UV_WASM_BROWSER: ${{ matrix.browser }}
        run: bun run vitest run --project browser

      - name: Say what a non-Chromium failure means
        if: failure() && matrix.browser != 'chromium'
        run: |
          echo "::warning::The browser gates failed on ${{ matrix.browser }}."
          echo "Chromium is the per-PR gate; this run reports engine drift rather than blocking."

  drift:
    name: the goldens against the live indexes
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Check out the fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          if [ -z "$FORK_TOKEN" ]; then
            echo "FORK_TOKEN is unset, so vendor/uv cannot be checked out."
            exit 1
          fi
          git config --global             url."https://x-access-token:${FORK_TOKEN}@github.com/KDust7/tholus-fork".insteadOf             "https://github.com/KDust7/tholus-fork"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --linker=isolated --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Build wasm artifact
        run: cargo xtask build --skip-opt

      - name: The Pyodide surface the adapter reaches for
        run: bun run vitest run --project unit test/parity/pyodide-surface.test.ts

      - name: The goldens against PyPI and the Pyodide index
        env:
          UV_WASM_LIVE: "1"
        run: bun run vitest run --project unit test/parity/live-index.test.ts

      - name: The same surface on the stable, previous and next Pyodide
        run: |
          node scripts/install-pyodide-matrix.mjs "$RUNNER_TEMP/pyodide-matrix"
          UV_WASM_PYODIDE_MATRIX="$RUNNER_TEMP/pyodide-matrix/matrix.json"             bun run vitest run --project unit test/parity/pyodide-matrix.test.ts

      - name: Say what drift means
        if: failure()
        run: |
          echo "::warning::A recorded golden no longer matches the live index, or Pyodide moved."
          echo "Re-record with scripts/record-fixtures.mjs, or read the adapter tripwire's message."
          echo "A failure on the *next* channel is early warning, not breakage: it says what an"
          echo "upgrade would cost before anyone pays it."

  crossvenv:
    name: the baseline a real Pyodide cross venv derives
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Check out the fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          if [ -z "$FORK_TOKEN" ]; then
            echo "FORK_TOKEN is unset, so vendor/uv cannot be checked out."
            exit 1
          fi
          git config --global             url."https://x-access-token:${FORK_TOKEN}@github.com/KDust7/tholus-fork".insteadOf             "https://github.com/KDust7/tholus-fork"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - run: bun install --linker=isolated --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Build wasm artifact
        run: cargo xtask build --skip-opt

      - name: Build native uv from the same fork commit
        working-directory: vendor/uv
        run: cargo build -p uv --bin uv --no-default-features

      - name: Create a real Pyodide cross venv
        run: |
          python -m pip install --upgrade pip pyodide-build
          pyodide xbuildenv install 314.0.5
          pyodide venv .venv-pyodide
          echo "UV_WASM_PYODIDE_PYTHON=$PWD/.venv-pyodide/bin/python" >> "$GITHUB_ENV"

      - name: The target we assert against the one a real Pyodide derives
        run: bun run vitest run --project unit test/parity/crossvenv-baseline.test.ts

      - name: Say what a disagreement means
        if: failure()
        run: |
          echo "::warning::A real Pyodide cross venv no longer agrees with the platform flags the"
          echo "install fixtures assert. Decision 21 rests on those two being the same target."
