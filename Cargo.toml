[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
authors = ["uv-wasm contributors"]

[workspace.dependencies]
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-time = "1.1"
anyhow = "1"
futures = "0.3"

[patch.crates-io]
astral_async_http_range_reader = { path = "vendor/uv/patches/astral-async-http-range-reader" }
astral-reqwest-retry = { path = "vendor/uv/patches/astral-reqwest-retry" }
astral-tokio-tar = { path = "vendor/uv/patches/astral-tokio-tar" }
retry-policies = { path = "vendor/uv/patches/retry-policies" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
